<!DOCTYPE html>
<html>
<head>
    <title>Payment Page</title>
</head>
<body>

<h2>Payment Form</h2>

<form>
    <label>Name on Card:</label><br>
    <input type="text" required><br><br>

    <input type="text" required><br><br>

</form>

</body>
</html>
